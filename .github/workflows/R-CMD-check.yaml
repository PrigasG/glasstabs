on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: "release"}
          - {os: windows-latest, r: "release"}
          - {os: ubuntu-latest,  r: "devel",  http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: "release"}
          - {os: ubuntu-latest,  r: "oldrel-1"}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      # CRAN has started serving some macOS binaries (knitr 1.52) as
      # zstd-compressed .tgz files, which pak cannot extract
      # ("unknown archive type"). Pre-install knitr from source so pak
      # sees it as satisfied and skips the broken binary.
      - name: Install knitr from source (macOS zstd-binary workaround)
        if: runner.os == 'macOS'
        run: Rscript -e 'install.packages("knitr", type = "source", repos = "https://cloud.r-project.org")'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # Browser tests (shinytest2/chromote) need a real Chrome; without it
      # they would fail instead of exercising the widget JavaScript.
      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
