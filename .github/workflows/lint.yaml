on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: lint

jobs:
  r-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr

      - name: Lint package
        run: lintr::lint_package()
        shell: Rscript {0}

  javascript-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript lint dependencies
        run: npm ci

      - name: Lint browser code
        run: npm run lint:js
