url: https://prigasg.github.io/glasstabs/

template:
  bootstrap: 5
  bootswatch: flatly

home:
  title: glasstabs - Animated Shiny Widgets
  description: |
    Animated glass-morphism tabs, single-select, and multi-select widgets for R Shiny.

navbar:
  bg: dark
  structure:
    left:
      - intro
      - articles
      - reference
    right:
      - search
      - github
  components:
    github:
      icon: fab fa-github
      aria-label: GitHub
      href: https://github.com/prigasG/glasstabs

articles:
  - title: Cheatsheet
    navbar: Cheatsheet
    contents:
      - cheatsheet
  - title: Getting started
    navbar: ~
    contents:
      - getting-started
      - posit-connect
  - title: Widgets
    navbar: Widgets
    contents:
      - tabs
      - indicators
      - glassSelect
      - multiselect

reference:
  - title: Setup
    desc: Load CSS/JavaScript, launch built-in examples, and view the changelog.
    contents:
      - useGlassTabs
      - runGlassExample
      - glasstabs_news

  - title: Tab widget - UI
    desc: |
      Animated tab navigation with glass, solid, or underline indicators; horizontal or vertical layouts; and Bootstrap 5 auto theming.
    contents:
      - glassTabsUI
      - glassTabPanel
      - glassTabsOutput
      - glass_tab_theme
      - glassTabCondition

  - title: Tab widget - server
    desc: |
      Server-side helpers for reading, switching, showing/hiding, disabling, badging, and dynamically rendering tabs.
    contents:
      - glassTabsServer
      - renderGlassTabs
      - updateGlassTabsUI
      - updateGlassTabBadge
      - showGlassTab
      - hideGlassTab
      - disableGlassTab
      - enableGlassTab
      - appendGlassTab
      - removeGlassTab

  - title: Select widgets
    desc: |
      Animated single-select and multi-select dropdown widgets for Shiny, with auto theming, search, update helpers, and reactive value helpers.
    contents:
      - glassSelect
      - updateGlassSelect
      - glassSelectValue
      - glassSelectServer
      - glassMultiSelect
      - updateGlassMultiSelect
      - glassMultiSelectValue
      - glassMultiSelectServer
      - closeGlassSelect
      - glassFilterTags
      - glass_select_theme

footer:
  structure:
    left: developed_by
